<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>大明王朝1566 · 剧情闯关</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --gold:#d4af37; --gold-dim:#8a6f2a; --paper:#e8dcc0; }
  body {
    min-height:100vh;
    background:
      radial-gradient(ellipse at 50% -10%, #3a2415 0%, transparent 55%),
      repeating-linear-gradient(90deg, rgba(255,255,255,.012) 0 2px, transparent 2px 6px),
      linear-gradient(180deg, #1c130c 0%, #120b06 100%);
    font-family:"Noto Serif SC","Source Han Serif SC","STSong","SimSun",serif;
    color:var(--paper); user-select:none;
  }
  .wrap { max-width:960px; margin:0 auto; padding:18px 16px 40px; }
  h1 { font-size:22px; letter-spacing:8px; color:var(--gold); text-align:center;
    text-shadow:0 0 18px rgba(212,175,55,.35); margin-bottom:4px; }
  .sub { text-align:center; font-size:12px; color:#8a7a5a; letter-spacing:3px; margin-bottom:20px; }
  .sub a { color:#8a7a5a; }
  .screen { display:none; } .screen.on { display:block; }

  /* ---- 选阵营 ---- */
  .factions { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; }
  .fc { border:1px solid var(--gold-dim); border-radius:8px; padding:16px 14px; cursor:pointer;
    background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(0,0,0,.25));
    border-top:3px solid var(--c); transition:all .2s; }
  .fc:hover { transform:translateY(-4px); box-shadow:0 8px 24px rgba(0,0,0,.5), 0 0 18px var(--c); }
  .fc .fa { width:46px; height:46px; border-radius:50%; border:2px solid var(--c); font-size:22px;
    display:flex; align-items:center; justify-content:center; color:#fff; margin-bottom:8px;
    background:radial-gradient(circle at 35% 30%, var(--c), #1a120c 130%); }
  .fc h3 { font-size:16px; letter-spacing:2px; color:#f0e2c0; margin-bottom:4px; }
  .fc p { font-size:11.5px; color:#9a8a6a; line-height:1.7; }
  .fc .prog { font-size:11px; color:var(--c); margin-top:8px; letter-spacing:1px; }

  /* ---- 关卡列表 ---- */
  .lvhead { display:flex; align-items:center; gap:14px; margin-bottom:14px; }
  .lvhead .fa { width:44px; height:44px; border-radius:50%; border:2px solid var(--c); font-size:20px;
    display:flex; align-items:center; justify-content:center; color:#fff;
    background:radial-gradient(circle at 35% 30%, var(--c), #1a120c 130%); }
  .lvhead h2 { font-size:19px; letter-spacing:4px; color:#f0e2c0; }
  .lvhead .back { margin-left:auto; }
  .btn { background:rgba(212,175,55,.08); color:#d8c9a0; border:1px solid var(--gold-dim);
    padding:7px 16px; border-radius:4px; cursor:pointer; font-family:inherit; font-size:13px;
    letter-spacing:2px; transition:all .2s; }
  .btn:hover { background:rgba(212,175,55,.2); color:#fff; }
  .lvlist { display:flex; flex-direction:column; gap:10px; }
  .lv { display:flex; align-items:center; gap:14px; border:1px solid #4a3826; border-left:3px solid var(--c);
    border-radius:6px; padding:12px 16px; cursor:pointer; transition:all .2s;
    background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(0,0,0,.2)); }
  .lv:hover { border-color:var(--c); box-shadow:0 0 14px rgba(212,175,55,.15); }
  .lv.locked { opacity:.4; cursor:not-allowed; }
  .lv .no { font-size:22px; color:var(--gold); width:34px; text-align:center; }
  .lv .lt { flex:1; }
  .lv .lt b { font-size:15px; letter-spacing:2px; color:#f0e2c0; display:block; margin-bottom:2px; }
  .lv .lt span { font-size:11.5px; color:#8a7a5a; }
  .lv .st { font-size:12px; letter-spacing:2px; }
  .lv .st.win { color:#4ecb71; } .lv .st.cur { color:var(--gold); }

  /* ---- 演出界面 ---- */
  #topbar { display:flex; align-items:center; gap:12px; margin-bottom:8px; flex-wrap:wrap; }
  #topbar .lvt { font-size:16px; letter-spacing:3px; color:#f0e2c0; }
  #hint { font-size:12.5px; color:#8a7a5a; margin-bottom:10px; letter-spacing:1px; line-height:1.8; }
  #hint b { color:#c0aa70; }

  #res { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:6px 18px;
    border:1px solid #3a2c1c; border-radius:6px; padding:8px 14px; margin-bottom:14px;
    background:rgba(0,0,0,.25); position:relative; }
  .rs .lab { display:flex; justify-content:space-between; font-size:11px; color:#8a7a5a; margin-bottom:2px; }
  .rs .lab b { color:#c0aa70; }
  .rs .t { height:5px; background:rgba(255,255,255,.05); border-radius:4px; overflow:hidden; }
  .rs .t i { display:block; height:100%; border-radius:4px; transition:width .6s; }
  #floater { position:absolute; right:14px; top:-6px; font-size:13px; color:#f5c56a; opacity:0;
    transition:all 1.2s; pointer-events:none; text-shadow:0 0 8px rgba(0,0,0,.8); z-index:9; white-space:nowrap; }
  #floater.go { opacity:1; transform:translateY(-22px); }

  #stage { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin-bottom:16px; min-height:96px; }
  .card { position:relative; width:118px; padding:10px 8px; text-align:center; opacity:.4;
    background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(0,0,0,.25));
    border:1px solid #4a3826; border-top:3px solid var(--c); border-radius:6px;
    transition:all .35s; }
  .card.speaking { opacity:1; box-shadow:0 0 24px var(--c); transform:translateY(-4px); }
  .card .av { width:44px; height:44px; margin:0 auto 5px; border-radius:50%; border:2px solid var(--c);
    background:radial-gradient(circle at 35% 30%, var(--c), #1a120c 130%);
    display:flex; align-items:center; justify-content:center; font-size:20px; color:#fff; }
  .card .av.photo { background:#1a120c; overflow:hidden; }
  .card .av.photo img { width:100%; height:100%; object-fit:cover; border-radius:50%; display:block; }
  .card.speaking .av.photo { box-shadow:0 0 0 2px #f2e8d0 inset; }
  .card .nm { font-size:14px; color:#f0e2c0; letter-spacing:1px; }
  .card .tt { font-size:10.5px; color:#8a7a5a; margin-top:2px; }

  #boxwrap { position:relative; }
  #box { border:1px solid var(--gold-dim); border-radius:8px; padding:18px 22px 30px; min-height:120px;
    background:linear-gradient(180deg, #f2e8d0, #e4d6b4); color:#2a1c10; font-size:15px; line-height:2.1;
    cursor:pointer; box-shadow:0 6px 30px rgba(0,0,0,.55), inset 0 0 60px rgba(139,109,60,.15);
    letter-spacing:.5px; }
  #box .who { color:#8a2020; font-weight:bold; margin-right:6px; }
  #box .nar { color:#5a4a30; }
  #box .more { position:absolute; right:16px; bottom:8px; color:#8a6f2a; font-size:12px;
    animation:bob 1.1s infinite; }
  @keyframes bob { 0%,100% { transform:translateY(0);} 50% { transform:translateY(4px);} }
  #box .ask { font-size:14.5px; color:#6a4a1a; font-weight:bold; margin-bottom:12px; letter-spacing:1px; }
  #chs { display:flex; flex-direction:column; gap:8px; cursor:default; }
  .ch { text-align:left; padding:10px 16px; border:1px solid #b09a6a; border-radius:6px;
    background:rgba(255,255,255,.35); color:#3a2a14; cursor:pointer; font-family:inherit;
    font-size:14.5px; letter-spacing:1px; transition:all .15s; line-height:1.7; }
  .ch:hover { border-color:#8a2020; background:#fff6e0; transform:translateX(5px); }
  .ch .sub { display:block; font-size:11px; color:#8a7a5a; margin-top:2px; }

  /* ---- 结算 ---- */
  .ov { position:fixed; inset:0; background:rgba(8,4,2,.93); z-index:100; display:none;
    align-items:center; justify-content:center; flex-direction:column; gap:18px;
    backdrop-filter:blur(6px); text-align:center; padding:30px; }
  .ov.show { display:flex; }
  .ov h2 { font-size:34px; letter-spacing:12px; color:var(--gold); text-shadow:0 0 30px rgba(212,175,55,.5); }
  .ov h2.lose { color:#c05040; text-shadow:0 0 30px rgba(192,80,64,.4); }
  .ov .txt { font-size:14.5px; color:#b0a080; max-width:560px; line-height:2.2; }
  .ov .poem { font-size:16px; color:#e0c98a; line-height:2.4; font-style:italic; }
  .ov .btns { display:flex; gap:12px; margin-top:8px; }
</style>
</head>

<div class="wrap">
  <h1>大明王朝1566</h1>
  <div class="sub">剧情闯关 ｜ 五阵营 · 二十关</div>

  <div id="sc-sel" class="screen">

</div>

</div>

      { n:[[-1,"腊月，流民聚了上千人，围了县衙。不是抢——是跪着。"],

      { c:{ p:"开仓要罪，不开仓要命。你面前的案上，是县仓的钥匙。", o:[
        { t:"开仓。——「罪在我一人。」", h:"擅开官仓，是死罪", fx:{min:15,wei:15,xin:10},
          r:[[-1,"仓门开了。你回到后堂，把官印捧出来，用红布包好，摆在案上——然后继续写赈济的名册。"]] },
        { t:"设粥厂，稀粥续命，等上宪明发赈令", h:"粥很稀，但能拖", fx:{min:5,wei:2,ku:-6},
          r:[[-1,"粥厂排了十里。粥稀得照见人影——可没人饿死在县衙门口。"]] },
        { t:"闭门——「仓无明令不开，这是法。」", h:"法没错，错的是年成", fx:{min:-15,wei:-8,xin:-12},
          r:[[-1,"那一夜，县衙外的哭声没有停。你在灯下坐到天亮，一夜白了几根头发。"]] } ] } },
      { n:[[-1,"开春，汪直卿再过淳安。他瘦了，你也瘦了。"],
          [1,"海大人，弹你的本章，七本。保你的民状，一百三十张。上头问下官：这个海瑞，是官，还是民？"],
          [0,"下官不知道。下官只知道淳安今年没绝户。"]] }
    ],
    win:[["min",">=",65],["xin",">=",60],["wei","<=",70]],
    lose:[["min","<=",25],["wei",">=",95]],
    wt:"大祲之年，淳安没有绝户。赈粮案的七本弹章没告倒你——一百三十张民状，把你抬过了这一关。",
    lt:"淳安饿殍，你被锁拿下狱。狱车出城那天，百姓沿河跪了一里——没有人敢哭出声。" },

  { t:"催科之争", hint:"织局岁办亏空，上峰把亏空摊派到淳安。加派，百姓反；不加，你的顶戴——<b>还有你的命</b>。",
    res:{ ku:25, min:50, wei:40, xin:60 },
    actors:[["海瑞","淳安知县","#4ecb71","海"],["里正","淳安里正","#9aa5a0","里"],["上官","杭州通判","#c05040","判"]],
    nodes:[
      { n:[[-1,"嘉靖四十二年，织局岁办亏空六万匹，部议摊派各府县。杭州通判带着文书到淳安：摊派三千匹，秋前缴齐。"],
          [2,"海大人，这不是本官为难你。摊派是部议，部议是阁拟。你缴，还是不缴？"]] },
      { c:{ p:"三千匹，摊到淳安头上，就是把稻农往绝路上逼。", o:[
        { t:"「淳安无桑，无丝，无织。无派。」——当面拒", h:"通判的脸，当场就变了", fx:{wei:12,min:8,xin:5},
          r:[[2,"好。好得很。本官的记录上，会写你这句话。"]] },
        { t:"应下摊派，秋后加派于民", h:"你的顶戴稳了，淳安的天塌了", fx:{ku:15,min:-15,wei:-5,xin:-10},
          r:[[1,"（里正磕头。）大人，淳安真的……榨不出来了。"]] },
        { t:"应下，但只派于大户丝行", h:"大户的状纸，比稻农的快", fx:{ku:8,min:2,wei:8},
          r:[[-1,"丝行掌柜连夜写了三张呈子，分别递往杭州、南京、北京。"]] } ] } },
      { n:[[-1,"夜。有人叩后衙的角门。一只封了红绸的箱子抬进来——一千两，淳安大户凑的。"],
          [1,"（里正低声。）大人，大伙儿的意思：这钱，您收下，摊派的事，请您高抬贵手。您要是不收……大伙儿就只好去告您「催科无状」了。"]] },
      { c:{ p:"一千两。箱子就摆在灯下。", o:[
        { t:"拒收，当堂拆封，银两当众发还", h:"大户们会记你一辈子", fx:{wei:8,xin:10,min:5},
          r:[[-1,"银子一锭一锭抬出去。围观的百姓看见，海大人的手，一直在抖——不是心疼，是气的。"]] },
        { t:"收下，全额抵作下年苗银", h:"银子没错，错的是给银子的人", fx:{ku:15,xin:-5,wei:-3},
          r:[[-1,"你把收条贴在了谯楼——「淳安海瑞，借大户银一千两，抵苗银」。字是好字，债是烂债。"]] },
        { t:"收下，封库，具报待查", h:"钱在库里，把柄在手里", fx:{ku:10,wei:6,xin:2},
          r:[[-1,"箱子入库，铅封。你写给杭州的公文里，一字未提收礼——只提「大户代纳」。"]] } ] } },
      { n:[[-1,"秋末，京察的考察专使到了杭州。淳安的考语，捏在通判手里——「最」与「污」，只在一笔之间。"],
          [2,"海大人，抚台的口气松了。只要你具本认错，摊派的事，可以改派。"]] },
      { c:{ p:"一纸「认错本」，换你一个「卓异」。", o:[
        { t:"不认。——「本官无过，何错之认。」", h:"你的官途，到此为止", fx:{wei:5,xin:8},
          r:[[-1,"专使走后，你把官印擦了三遍。擦得很亮——像擦一面镜子。"]] },
        { t:"具本自劾「催科无状」，字认，理不认", h:"认个态度，保住淳安", fx:{wei:-6,min:-3,xin:3},
          r:[[-1,"自劾本里，你一条罪也没认，只写了一句话：「淳安之困，困于摊派，非困于催科。」"]] },
        { t:"八百里加急，直呈南京都察院", h:"越了三级的府，也越了三级的命", fx:{wei:12,xin:10},
          r:[[-1,"加急的文书出城时，通判在城门口截了三次——没截住。"]] } ] } },
      { n:[[-1,"冬。考语下来了：「淳安知县海瑞，肆奸植党，疾之如仇。」——「最」是没有了，「污」也没有。"],
          [1,"（里正捧着抄件，手抖。）大人，这八个字，是罪，还是功？"],
          [0,"史书会替我认这笔账。"]] }
    ],
    win:[["min",">=",55],["xin",">=",65],["ku",">=",20]],
    lose:[["wei",">=",90],["min","<=",25]],
    wt:"摊派没有落到稻农头上。考语是「肆奸植党」——淳安的百姓说，这四个字，是海大人的功德碑。",
    lt:"加派的鞭子落在淳安身上，百姓逃了三分之一。你在空了的里甲册上，画了一个押。" },

  { t:"治安疏", hint:"你调任户部云南司主事。棺材备好了，妻子遣散了。<b>这一疏上去，要么青史，要么刀口</b>。",
    res:{ wei:35, yao:55, xin:60 },
    actors:[["海瑞","户部主事","#4ecb71","海"],["友人","同僚","#9aa5a0","友"],["王用汲","南京户部","#e0a040","王"]],
    nodes:[
      { n:[[-1,"嘉靖四十五年，冬。你的寓所里停着一口薄棺。你遣散了僮仆，把后事交代了两遍。"],
          [-1,"案上，是写了一个月的奏疏。疏稿的每一个字，你都咬过——像咬自己的骨头。"],
          [1,"（友人破门而入。）刚峰！你疯了！那是诏狱！是凌迟！"]] },
      { c:{ p:"疏稿在手，棺木在堂。上，还是不上？", o:[
        { t:"上疏。——「备位承平，愧无敢死之气，是臣之罪。」", h:"从此刻起，你是海刚峰", fx:{wei:20,yao:15,xin:5},
          r:[[2,"（王用汲替你买好了棺材。）我替你送终。你替天下说话。"],
             [-1,"疏出齐化门。满城的人都在传抄，纸贵了三倍。"]] },
        { t:"疏稿投进火盆——「留这条命，再做实事」", h:"留命容易，留骨气难", fx:{wei:-10,yao:-15},
          r:[[-1,"火苗舔上疏稿的时候，你伸手进去，把它抢了出来。"],
             [-1,"你坐在地上，拿着烧焦的纸角，坐了一夜。天亮时，你重新铺开了一张纸。"]] } ] } },
      { n:[[-1,"疏入。西苑没有回音。一天，两天，七天。"],
          [-1,"第八天，缇骑到了。你穿着官服，在午门外自己上了枷。围观的人越聚越多，没有人说话。"]] },
      { c:{ p:"丹陛之上，皇帝亲审。他问你：你凭什么骂朕？", o:[
        { t:"据实直对：「陛下修玄二十五年，天下赋重，民不聊生。」", h:"一字不让", fx:{wei:8,yao:10},
          r:[[0,"臣疏中所言，一字一句，皆有实据。陛下可召天下督抚问之。"],
             [-1,"据说，御座上的呼吸声，隔了三丈都听得见。"]] },
        { t:"叩首：「臣罪该万死，然言为天下发。」", h:"软话硬骨", fx:{wei:-5,yao:5},
          r:[[0,"臣死罪。但疏里的话，不是臣的话，是天下百姓的话。"]] },
        { t:"闭口不言", h:"沉默也是一种供词", fx:{wei:5,yao:-3},
          r:[[-1,"你闭着眼。问十句，答一句：「臣在疏中已尽言。」"]] } ] } },
      { n:[[-1,"诏狱。你的牢房反而干净——狱卒敬你。外面，救你的本子和害你的本子，一样多。"],
          [2,"（王用汲探监，隔着栅栏。）刚峰，上头递过话来：具本谢罪，可减等。"]] },
      { c:{ p:"一纸谢罪本，出去；不谢，等刀。", o:[
        { t:"不谢罪。——「臣无罪可谢。」", h:"等刀，或者等改元", fx:{yao:12,wei:3},
          r:[[-1,"王用汲对着你作了个深揖，转身走了。他在狱外，替你养那口棺材。"]] },
        { t:"具本谢罪，保全有用之身", h:"活着出去，还是死出去？", fx:{yao:-10,wei:-8},
          r:[[-1,"谢罪本递上去，没有回音。你忽然明白——他要的不是你的罪，是你的名。"]] } ] } },
      { n:[[-1,"嘉靖四十五年十二月，西苑驾崩的丧钟响了。诏狱的门开了——新帝登基，大赦天下。"],
          [-1,"你走出西市街旧狱，外头的雪停了。王用汲在门口等你，手里拎着一壶酒。"],
          [2,"刚峰，出来了。外面，变天了。"],
          [0,"（你回头看了一眼诏狱的门。）天不变，我也要说。"]] }
    ],
    win:[["yao",">=",75],["wei","<=",80]],
    lose:[["wei",">=",95],["yao","<=",40]],
    wt:"《治安疏》传抄天下。你没死——你活着看见了改元。海青天的名字，从这一疏开始，写进了史书。",
    lt:"疏稿烧了，或者刀落了。总之，那道《治安疏》没有出现在史书上——大明的史书上，少了一根骨头。" }
]},
yan:{ name:"严党 · 严阁老", c:"#c05040", av:"严",

  levels:[
  { t:"改桑献策", hint:"户部亏空二十万，皇上在等一个「富国而不加赋」的法子。<b>改稻为桑</b>——这剂药是你开的。",
    res:{ qian:50, quan:55, wei:25, sheng:55 },

    nodes:[
      { n:[[-1,"值房。严世蕃把算盘打得震天响：浙江一省改桑，三年可增税银百万。"],
          [1,"爹，这可是天大的功劳！皇上正为亏空发愁，咱们递梯子，就是递忠心。"]] },
      { c:{ p:"这剂药递上去，治的是国库的病，抓的是浙江的药。", o:[
        { t:"递。——「富国而不加赋，舍此莫由。」", h:"功劳是严党的，骂名也是", fx:{qian:12,sheng:6,wei:8},
          r:[[1,"皇上准了！郑泌昌、何茂才都是咱们的人，浙江翻不了天。"],
             [-1,"你提笔拟旨。窗外，徐阶的门房，悄悄往西苑的方向去了。"]] },
        { t:"递，但加一条：「田价官定，禁贱买民田」", h:"世蕃会说你多此一举", fx:{qian:8,wei:3,sheng:4},
          r:[[1,"爹！加这条，大户们还怎么买田？咱们还怎么……"],
             [0,"住口。药要治病，不能要命。要命的药，最后要的是我们的命。"]] },
        { t:"不递。——让户部自己想办法", h:"皇上会失望，徐阶会窃喜", fx:{qian:-8,sheng:-6,wei:-5},
          r:[[1,"爹！到手的功劳，就这么撒出去？"],
             [-1,"数日后，徐阶的门生「恰好」上了一道折子，说的也是改稻为桑。你盯着那道折子看了很久——这个徐阶，藏得深。"]] } ] } },
      { n:[[-1,"改桑令下，浙江的动作比你想的还快。半年，淳安、建德的大户买田万亩，流民开始北上。"],
          [2,"（徐阶在阁中散值时「无意」提起。）阁老，浙江的流民，都到北京城下了。御史的折子，怕是要来了。"]] },
      { c:{ p:"御史的弹章在路上。你的应对是——", o:[
        { t:"叫郑泌昌「安抚」：给流民一口粥，打发回籍", h:"粥里有没有沙子，只有郑泌昌知道", fx:{wei:6,qian:-4},
          r:[[1,"爹，泌昌回话：流民已散。就是……散的时候，死了几个人。"],
             [-1,"你闭上眼。几个人，换一省的局面——这笔账，你会算，皇上也会算。"]] },
        { t:"主动具本：「改桑善政也，执行者过也」——弃车保帅", h:"砍的是自己人的头", fx:{wei:-8,sheng:5,quan:-5},
          r:[[1,"爹！何茂才是咱们的人！说砍就砍？"],
             [0,"不砍他，下一步砍的就是你。去，把拟好的罪本送来。"]] },
        { t:"让世蕃去户部「走一趟」，把弹章压下来", h:"纸包不住火，但纸能拖时间", fx:{wei:10,qian:5,sheng:-4},
          r:[[-1,"弹章压了三个月。三个月后，它们变成十本，从六科廊里飞出来——压得越久，飞得越高。"]] } ] } },
      { n:[[-1,"年底，浙江税银入库，户部的亏空补了大半。皇上在青词上批了「知道了」三个字——对严党来说，这就是天恩。"],
          [1,"爹，您看，皇上心里还是有咱们的。"],
          [-1,"你望着那三个字，没有说话。你伺候了皇上二十年，你知道——「知道了」后面，往往跟着「但是」。"]] }
    ],
    win:[["qian",">=",55],["sheng",">=",50],["wei","<=",60]],
    lose:[["wei",">=",90],["sheng","<=",25]],
    wt:"税银入库，亏空得补，皇上朱笔「知道了」。改桑这剂虎狼药，暂时没吃死人——至少没吃死自己人。",
    lt:"浙江的流民进了北京城，御史的弹章堆满了廊下。皇上没有问罪——他只是把改桑的差事，交给了别人。" },

  { t:"京察大计", hint:"京察之年，御史们盯着严党的「贪」字。党羽遍布天下，<b>保谁，弃谁，是一门手艺</b>。",

    nodes:[
      { n:[[-1,"京察在即。都察院的考语册子上，严党名字旁都画了圈——清流们管这叫「拔桩」。"],
          [1,"爹，鄢懋卿两淮巡盐，一年孝敬咱们三百万。都察院要动他，说什么也不能让他开口。"]] },
      { c:{ p:"鄢懋卿是钱袋子，也是定时炸弹。京察册上，怎么写他？", o:[
        { t:"保。——「鄢某办盐九年，岁课不缺，堪任繁剧。」", h:"保他，就是把自己押上去", fx:{quan:6,wei:12,qian:8},
          r:[[2,"爹英明！盐税的银子，下个月就到。"],
             [-1,"都察院的弹章当天到了：「严党私盐，根蟠盘错。」第一句，就是鄢懋卿。"]] },
        { t:"弃。——考语「不谨」，让他致仕", h:"钱袋子破了，但人头保住了", fx:{wei:-10,qian:-10,quan:-4},
          r:[[2,"爹！我跟他爹是一拜之交！说扔就扔？"],

      { n:[[-1,"京察榜出。清流们动了浙江一系的三个官——都是你的门生。郑泌昌连夜递信入京：「若朝廷不救，别怪学生不义。」"],
          [-1,"不义？什么叫不义？你教了他二十年「义」字怎么写——他如今拿这个字，跟你谈价钱。"]] },
      { c:{ p:"郑泌昌要价：保他的官，否则他供出「改桑摊派」的来处。", o:[
        { t:"保。——叫吏部把三个名字从察典里抠出来", h:"察典上抠名字，是打吏部的脸", fx:{quan:5,wei:12,sheng:-5},
          r:[[1,"爹，吏部那边打点好了。名字抠掉了，都察院那边……炸了。"]] },
        { t:"不保。——「让他去告。告到御前，也是咱们输吗？」", h:"赌皇上护你，赌郑泌昌没证据", fx:{wei:8,quan:-6,sheng:4},
          r:[[0,"他告谁？告改桑？改桑是御批的。他告到御前，先打死的是他自己。"],
             [-1,"郑泌昌的状纸没有递出去——他不敢。但你府上的门客，当夜去了浙江。"]] },
        { t:"给个甜枣：升他的虚衔，换他闭嘴", h:"花钱买平安", fx:{qian:-8,wei:-5,quan:2},

          r:[[-1,"老阁老颤巍巍票了个「可」。严党谢了老阁老，清流骂你滑头——两头不讨好，但两头都还安全。"]] } ] } },
      { n:[[-1,"秋闱后放榜，严党门生占了半榜。你的门生李春芳高中一甲——你的翰林故旧里，终于有人进了清要之地。"],
          [1,"先生，都察院新科十三道御史里，有三位是您的门生。"]] },
      { c:{ p:"新科御史们摩拳擦掌，要「言事」。你给他们什么令？", o:[
        { t:"「言。但言小事——言风闻言事之弊，言灾异，言漕运。」", h:"小刀试刀，别见血", fx:{ref:8,wei:3},
          r:[[-1,"三位新御史连上七道本章，道道安全，道道在理。严嵩懒得理——他不知道，刀磨得越慢，越亮。"]] },
        { t:"「都给我忍着。没有我的字，一道本也不许上。」", h:"忍到刀出鞘那天", fx:{wei:-6,quan:3},
          r:[[0,"（你给三位御史各写了一封信，信上只有八个字。）位卑言高，罪也。俟时。"],
             [-1,"三位御史把信收进袖里，从此上折之前，先寄一封家书——他们学会了你这一派的命根子：等。"]] },
        { t:"「言严世蕃。」——让新刀见血", h:"新御史撞严党，是鸡蛋碰石头", fx:{ref:-8,wei:12},
          r:[[-1,"第一道弹章上去，第三天，弹人的御史就被外放了。你在吏部的调令上画押，一笔都没抖——心抖了。"]] } ] } },
      { n:[[-1,"冬夜，你收到严府请帖：阁老八十五岁寿辰，命你「务必赏脸」——满京城都盯着这场寿宴。"],
          [0,"（你提笔回帖，只写四个字。）一定到。"],

    ],

    lt:"一篇青词触了龙鳞，一纸票拟结了死仇。圣眷收回的那天，你在值房坐到三更——刀还没磨快，鞘先折了。" },

  { t:"浙江案", hint:"沈一石案、改桑案、御状案——三案并卷，浙江是严党的钱袋子，<b>也是命门</b>。海瑞的状纸，递到了你门口。",
    res:{ ref:50, wei:40, sheng:48, quan:45 },
    actors:[["徐阶","内阁次辅","#7ec8ff","徐"],["海瑞","淳安知县","#4ecb71","海"],["严世蕃","工部侍郎","#c05040","蕃"]],
    nodes:[
      { n:[[-1,"深夜，一封没有署名的状纸从后门递进徐府——是海瑞托人千里送来的浙江实档：田价、人命、桑价、织局的账。"],
          [1,"先生，这纸状纸要是接了，就是接了严党的战书。海瑞一个七品，他敢递，您敢接吗？"]] },
      { c:{ p:"状纸在案上。接，还是不接？", o:[
        { t:"接。——「浙江的百姓，把状纸递到我门口了。」", h:"接状纸，就是接火种", fx:{ref:10,wei:10,sheng:4},
          r:[[0,"（你逐页誊录，誊到天亮。）他敢递，我就敢烧——不是烧状纸，是烧它该烧的东西。"]] },
        { t:"原封不动，转呈都察院——「公事公办」", h:"最安全的接法", fx:{wei:5,ref:3},

        { t:"不见。——「不见此纸，不闻此事。」", h:"火种退回火里", fx:{wei:-5,ref:-6},
          r:[[-1,"状纸原路退回。三个月后海瑞自己进京，一路告，一路抄，抄到南京——你听说了，什么也没说。"]] } ] } },
      { n:[[-1,"三案并卷，皇上问内阁：浙江的事，怎么办？严嵩举郑泌昌自辩，清流举海瑞对质。两派人马，在文华殿外撞了个照面。"],
          [2,"（严世蕃拦在你轿前，皮笑肉不笑。）徐阁老，浙江的案子，查的是官，还是查的是国策？国策要是错了……嘿嘿，批红的是谁呢？"]] },
      { c:{ p:"严世蕃把最毒的一句话，当面说了出来——国策是御批的。", o:[
        { t:"「查官，不查策。——贪墨是罪，改桑不是。」", h:"给他一个台阶，也给自己留一条活路", fx:{wei:-6,quan:5},
          r:[[2,"（严世蕃笑了。）徐阁老到底是明白人。"],
             [-1,"你这句话传进西苑，皇上点了点头——查贪不查策，保的是皇上的脸面。你的案子，能查了。"]] },
        { t:"「国策对错，皇上自有明断。臣等只问浙江死了多少人。」", h:"把刀锋引回人头", fx:{wei:8,sheng:6,ref:5},
          r:[[0,"（你在殿上只报了一个数。）浙江改桑以来，流民四万，人命三百七十。陛下，臣请查。"],
             [-1,"御座上没有声音。严嵩跪下去替浙江请罪——第一次，他跪得那么低。"]] },
        { t:"不接话，回府称病", h:"让子弹飞一会儿", fx:{wei:3,quan:-3},
          r:[[-1,"你称病三日。三日内严党四处活动，清流群龙无首——第四日你上朝，发现案子已经被「议」掉了一半。"]] } ] } },
      { n:[[-1,"查案的人选定了：你举的海瑞对质，严党举的刑部主事问案。公堂未开，风声先紧——海瑞在杭州城外，被人「请」进了驿站，一住七天。"],
          [1,"先生，海瑞被扣在驿站，严党放话：他要是敢上堂，淳安的老底就翻出来——他那点「折价赈济」的旧账。"]] },
      { c:{ p:"你的证人被扣在半路。救，还是不救？", o:[
        { t:"八百里加急直递御前：「证人未至，国法先辱。」", h:"为救一个七品，押上次辅的脸面", fx:{ref:8,wei:6,sheng:3},
          r:[[0,"（御前你只说了一句。）陛下，扣一个知县容易。天下人看见的，是朝廷怕一个知县。"],
             [-1,"当夜，驿站的门开了。海瑞进京那天，没人再敢「请」他。"]] },
        { t:"叫浙江的门生「护送」海瑞进京", h:"暗渠救人，快，但脏", fx:{ref:5,wei:3},
          r:[[-1,"「护送」的驿马三天跑完十五天路。海瑞到京时瘦脱了形，怀里抱着浙江的田册——比命抱得紧。"]] },
        { t:"按兵不动——让严党自己演", h:"看戏，但证人可能死", fx:{wei:-4,ref:-5},
          r:[[-1,"海瑞在驿站「病」了。严党送医送药，照顾得无微不至——三个月后他回淳安，田册被「借看」，再没还回来。"]] } ] } },
      { n:[[-1,"公堂对质那日，海瑞当堂背出浙江田价，一字不差。郑泌昌的脸色，比堂外的天还灰。"],
          [2,"（散堂时，严世蕃在角门等你。）徐阁老，今天赢的是一个七品。您猜，皇上心里记的是谁？"],
          [0,"（你看着他，笑了笑。）记的是浙江死了多少人。——放心，会记得越来越清的。"]] }
    ],

    nodes:[
      { n:[[-1,"皇上把你单独留在西苑，问了一句没头没尾的话：「徐卿，严嵩老了，你看，谁可代之？」"],

          r:[[0,"（你俯身。）严嵩去留，陛下之权，非臣之分。臣只知办事，不知其他。"],

          r:[[-1,"皇上把茶盏放下，没有接话。你出西苑时后背是凉的——催皇帝下决心的人，皇帝也会记一辈子。"]] } ] } },
      { n:[[-1,"严世蕃被逐回籍，严嵩成了没牙的老虎。都察院的弹章雪片一样飞来——现在，轮到清流决定：咬多狠。"],
          [1,"（张居正深夜来访。）先生，史朝远的十大罪本已成稿。学生只求先生一件事——留严嵩一命，杀世蕃，够了。"]] },
      { c:{ p:"斩草，还是除根？", o:[
        { t:"「杀世蕃，全嵩首领。」——留严嵩全尸善终", h:"给天下看：清流不嗜杀", fx:{sheng:8,wei:-8,quan:5},
          r:[[0,"（你在票拟上落笔。）嵩，退。世蕃，法办。"],
             [-1,"消息传出，严嵩在值房坐了一夜。第二天他递上致仕本，皇上批了——批得比谁都快。"]] },
        { t:"赶尽杀绝——严嵩父子，一个不留", h:"痛快，但清流会变成另一个严党", fx:{wei:10,sheng:-6,quan:-5},
          r:[[-1,"你连上三本，把八十五岁的严嵩钉在十大罪上。皇上都嫌急了——朱批：「首辅旧臣，从长计议。」"],
             [-1,"从长计议。你忽然懂了：你把皇上逼到了要护他的地步。"]] },
        { t:"引而不发——让严嵩自己「乞休」", h:"最体面的收场", fx:{wei:-5,quan:3},
          r:[[-1,"你的门生只递了一道本：「嵩老矣，宜全令名。」严嵩自己看懂了，三日后，致仕本到了。"]] } ] } },
      { n:[[-1,"严嵩致仕还乡那天，你替他写了离京的途费勘合——按首辅全礼，一站不缺。"],
          [2,"（张居正不解。）先生，他倒台，您送他？"],
          [0,"（你望着南官道上的车马。）居正，记住——我们倒严，不是因为我们恨他。是因为天下不该只有一个严嵩。"],

silu:{ name:"司礼监 · 吕芳", c:"#b07ae0", av:"吕",

  levels:[
  { t:"当家", hint:"司礼监掌印太监吕芳，白天替皇上批红，晚上替皇上熬药。<b>严党的礼、清流的信、裕王的使者</b>——都在等你这盏灯。",

    nodes:[
      { n:[[-1,"夜，直房。案上三样东西：严府送来的一对玉镯、徐府转来的一封家书、裕王府长史「求见」的口信。"],
          [1,"（陈洪在旁阴阳怪气。）干爹，严阁老的镯子，成色好啊。这年头，孝敬司礼监的，比孝敬皇上的还勤。"]] },
      { c:{ p:"三样东西，三个方向。你怎么动？", o:[

             [1,"（陈洪的脸黑了。）干爹，这么着，往后谁还敢孝敬咱们？"],
             [0,"孝敬？（你把账本合上。）咱家要他们孝敬的，是「不敢不送」——不是「收了」。"]] },
        { t:"镯子退回，家书留下，裕王府的口信烧了", h:"留一封清流的信，是留一条后路", fx:{quan:5,wei:6},
          r:[[-1,"家书你读了，回了一个「安」字。裕王府的口信，看着它烧成灰——烧的时候，手很稳。"]] },
        { t:"三样都不动，先研墨批红", h:"天塌下来，先当值", fx:{sheng:4,ping:5},
          r:[[0,"（你把三样东西推到案角，铺开本章。）皇上的本章批不完，玉镯能变成枷锁，家书能变成罪证。"],
             [-1,"批红到三更。第二天，三样东西的主人各收到一句话：「吕公公当值，没空。」——三个人，三种安心。"]] } ] } },
      { n:[[-1,"晨，精舍。皇上批本章，忽然把笔搁下了：「吕芳，外头都说，严嵩的票拟，到你手里十批九准。有这事么？」"],
          [-1,"这一问，比刀还快。答得好是忠，答得偏是党。"]] },
      { c:{ p:"皇上的这一问，怎么答？", o:[

          r:[[0,"（你跪着，声音不高。）本章哪一笔不是御前圈定？奴婢的手，是皇上用惯了的一支笔。"],

        { t:"「严阁老的票拟，是妥当。」——替严嵩说一句", h:"一句公道话，值多少钱，你自己掂", fx:{wei:8,quan:4},
          r:[[-1,"皇上没抬头，只「嗯」了一声。这一声，你回去想了三夜——是记你的公道，还是记你的党？"]] },
        { t:"「奴婢该死。往后严阁老的票，奴婢一笔一笔细核。」", h:"表忠表过了，严党会知道", fx:{wei:5,sheng:3,quan:-5},
          r:[[0,"（你叩首。）奴婢明日就细核。"],
             [-1,"第二天你果然细核，核出两处小错，封还内阁。严嵩的票拟上多了两个朱点——严党上下，如坐针毡。"]] } ] } },
      { n:[[-1,"裕王宫里传出话：裕王世子诞辰，宫里按例该有赏。可皇上忘了——不是忘，是不好意思提儿子。"],
          [2,"（黄锦悄悄来问。）吕公公，世子的赏……您看，是提醒皇上，还是咱们内官监自己凑一份？"]] },
      { c:{ p:"皇上的儿子，司礼监的规矩。怎么办？", o:[

          r:[[0,"（精舍里静了片刻。）……哦。取内库的玉锁来。就说是……宫务处报上来的。"],

        { t:"内官监自己凑，以「宫里例赏」名义送去", h:"花宫里的钱，买裕王的情", fx:{quan:5,wei:6,ping:-3},

        { t:"装不知道", h:"最安全，也最冷", fx:{wei:-3,ping:-5},

      { n:[[-1,"深夜散值，陈洪堵在宫门口：「干爹，您这一套，严党恨您，清流防您，裕王敬您——皇上呢？皇上用您，可皇上信您吗？」"],
          [0,"（你提着灯笼，走了三步，回头。）陈洪，咱家伺候皇上，不为信，也不为恨。"],

  text:"你这一生，无党无援，屡起屡踬。可隆庆朝你被起复，万历朝你官至南京右都御史。你死后，南京百姓罢市相送，白衣满城。史书给你四个字：海青天。——孤臣的路，走通了。" },
yan:{ poem:"眼看他起朱楼，眼看他宴宾客，眼看他楼塌了。<div style='font-size:12px;color:#6f5f42'>—— 孔尚任《桃花扇》</div>",
  text:"你终究没能斗过历史——但在这条时间线里，你保全了家族，全始全终。归里那年，你在灯下重读自己写的青词，忽然分不清：哪一句是写给上天的，哪一句是写给自己的。" },
qingliu:{ poem:"千淘万漉虽辛苦，吹尽狂沙始到金。<div style='font-size:12px;color:#6f5f42'>—— 刘禹锡《浪淘沙》</div>",
  text:"你做了十年首辅，一条鞭法铺向天下，万历初年的中兴，底子是你打的。张居正接手时，对你执弟子礼。你临终前让人取来那卷旧档，上面只有两个字：忍，等。" },
silu:{ poem:"诸葛一生唯谨慎，吕端大事不糊涂。<div style='font-size:12px;color:#6f5f42'>—— 顾宪成联，剧中吕芳座右铭</div>",
  text:"改元诏书上没有你的名字，可新帝登基那夜，在殿外看了你一眼，对裕王旧臣说：「吕芳，老忠了。」你回直房，把那盏琉璃灯吹熄了。宫里的长夜，你守到了天亮。" },
jiajing:{ poem:"黄河尚有澄清日，人间再无清净时。<div style='font-size:12px;color:#6f5f42'>—— 明谚，改</div>",
  text:"你驭了一辈子平衡，修了一辈子玄。弥留之际，你想起海瑞那句「家家皆净」，忽然笑了：骂就骂吧，这天下，终究是替你扛住了。你死后庙号「肃」——明史上最有才也最孤独的皇帝。" }
};

/* ================= 存档 ================= */
const SAVE_KEY = "ming1566_lv";
function loadSave(){ try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; } catch(e){ return {}; } }
function saveUnlock(cid, n){ const s = loadSave(); if((s[cid]||0) < n){ s[cid]=n; localStorage.setItem(SAVE_KEY, JSON.stringify(s)); } }

/* ================= 界面路由 ================= */
const $ = s => document.querySelector(s);
function show(id){ document.querySelectorAll(".screen").forEach(x=>x.classList.remove("on")); $(id).classList.add("on"); }

function renderSelect(){
  const s = loadSave();
  $("#factions").innerHTML = Object.entries(CAM).map(([id,c])=>{
    const done = s[id]||0;
    return `<div class="fc" style="--c:${c.c}" data-c="${id}">
      <div class="fa">${c.av}</div><h3>${c.name}</h3><p>${c.desc}</p>
      <div class="prog">${done>=4?"✓ 已通关":done>0?`已通 ${done}/4 关`:"未开始"}</div></div>`;
  }).join("");
  document.querySelectorAll(".fc").forEach(el=>el.onclick=()=>openCampaign(el.dataset.c));
  show("#sc-sel");
}

function openCampaign(cid){
  $("#ov").classList.remove("show");
  const c = CAM[cid], s = loadSave(), done = s[cid]||0;
  $("#lvhead").innerHTML = `<div class="fa" style="--c:${c.c}">${c.av}</div><h2>${c.name}</h2>
    <button class="btn back" id="lv-back">返回</button>`;
  $("#lv-back").onclick = renderSelect;
  $("#lvlist").innerHTML = c.levels.map((L,i)=>{
    const locked = i > done, win = i < done;
    return `<div class="lv ${locked?"locked":""}" style="--c:${c.c}" data-i="${i}">
      <div class="no">${win?"✓":i+1}</div>
      <div class="lt"><b>${L.t}</b><span>${L.hint.replace(/<[^>]+>/g,"").slice(0,36)}…</span></div>
      <div class="st ${win?"win":locked?"":"cur"}">${win?"通关":locked?"未解锁":"可挑战"}</div></div>`;
  }).join("");
  document.querySelectorAll(".lv").forEach(el=>{
    if(!el.classList.contains("locked")) el.onclick = ()=>startLevel(cid, +el.dataset.i);
  });
  show("#sc-lv");
}

/* ================= 引擎 ================= */
let cur = null;
const clamp = v => Math.max(0, Math.min(100, v));
const met = cs => cs.every(([k,op,v]) => op===">=" ? cur.res[k]>=v : cur.res[k]<=v);

function startLevel(cid, li){
  const L0 = CAM[cid].levels[li];
  $("#ov").classList.remove("show");
  cur = { cid, li, L:JSON.parse(JSON.stringify(L0)), res:{...L0.res}, ni:0, ln:0, over:false };
  $("#p-title").textContent = `${CAM[cid].name} · ${L0.t}`;
  $("#hint").innerHTML = L0.hint;
  $("#stage").innerHTML = L0.actors.map((a,i)=>
    `<div class="card" id="ac-${i}" style="--c:${a[2]}">
     ${(()=>{const u=AVATARS[NAME2AV[a[0]]];return u?`<div class="av photo"><img src="${u}" alt="${a[0]}"></div>`:`<div class="av">${a[3]}</div>`;})()}<div class="nm">${a[0]}</div><div class="tt">${a[1]}</div></div>`).join("");
  renderRes();
  show("#sc-play");
  node();
}
function rcol(k){ return BADR[k] ? "#c05040" : "#d4af37"; }
function renderRes(){
  const bars = Object.entries(cur.res).map(([k,v])=>
    `<div class="rs"><div class="lab"><span>${RESN[k]}${BADR[k]?"（低好）":""}</span><b>${Math.round(v)}</b></div>
     <div class="t"><i style="width:${v}%;background:${rcol(k)}"></i></div></div>`).join("");
  $("#res").innerHTML = bars + `<div id="floater"></div>`;
}
function floater(txt){
  const f = $("#floater"); if(!f) return;
  f.textContent = txt; f.classList.remove("go"); void f.offsetWidth; f.classList.add("go");
}
function applyFx(fx){
  const parts = [];
  for(const k in fx){
    if(!(k in cur.res)) continue;
    cur.res[k] = clamp(cur.res[k] + fx[k]);
    parts.push(`${RESN[k]}${fx[k]>0?"+":""}${fx[k]}`);
  }
  renderRes();
  return parts.join(" ");
}
function speak(w){
  document.querySelectorAll(".card").forEach(c=>c.classList.remove("speaking"));
  if(w>=0){ const c = $(`#ac-${w}`); if(c) c.classList.add("speaking"); }
}
function node(){
  const nd = cur.L.nodes[cur.ni];
  if(!nd){ end(); return; }
  if(nd.c) choice(nd);
  else { cur.ln = 0; line(); }
}
function line(){
  const [w,t] = cur.L.nodes[cur.ni].n[cur.ln];
  speak(w);
  $("#box").innerHTML = (w<0 ? `<span class="nar">${t}</span>` : `<span class="who">${cur.L.actors[w][0]}</span>${t}`)
    + `<span class="more">▼ 点击继续</span>`;
}
function advance(){
  if(!cur || cur.over) return;
  const nd = cur.L.nodes[cur.ni];
  if(!nd || nd.c) return;
  cur.ln++;
  if(cur.ln < nd.n.length) line();
  else { cur.ni++; node(); }
}
function choice(nd){
  speak(-1);
  let h = `<div class="ask">${nd.c.p}</div><div id="chs">`;
  nd.c.o.forEach((o,i)=>{
    h += `<button class="ch" data-o="${i}">${o.t}${o.h?`<span class="sub">${o.h}</span>`:""}</button>`;
  });
  $("#box").innerHTML = h + "</div>";
  document.querySelectorAll(".ch").forEach(b=>b.onclick = e=>{ e.stopPropagation(); pick(+b.dataset.o); });
}
function pick(oi){
  const nd = cur.L.nodes[cur.ni], o = nd.c.o[oi];
  const parts = applyFx(o.fx||{});
  if(parts) floater(parts);
  cur.ni++;
  if(o.r) cur.L.nodes.splice(cur.ni, 0, {n:o.r});
  for(const k in cur.res) if(BADR[k] && cur.res[k]>=100){ end(true); return; }
  node();
}
function end(crash){
  cur.over = true;
  const L = cur.L, c = CAM[cur.cid];
  const win = !crash && !met(L.lose) && met(L.win);
  if(win) saveUnlock(cur.cid, cur.li + 1);
  $("#ov-t").textContent = win ? "旗开得胜" : "功败垂成";
  $("#ov-t").className = win ? "" : "lose";
  $("#ov-x").innerHTML = (win ? L.wt : L.lt) + `<br><br><span style="color:#6f5f42">结局：${
    Object.entries(cur.res).map(([k,v])=>`${RESN[k]} ${Math.round(v)}`).join(" · ")}</span>`;
  const btns = $("#ov-b");
  if(win){
    if(cur.li + 1 >= c.levels.length){
      btns.innerHTML = `<button class="btn" id="b-final">查看阵营结局</button>`;
      $("#b-final").onclick = ()=>showFinal(cur.cid);
    } else {
      btns.innerHTML = `<button class="btn" id="b-next">下一关</button><button class="btn" id="b-back2">选关</button>`;
      $("#b-next").onclick = ()=>{ $("#ov").classList.remove("show"); startLevel(cur.cid, cur.li+1); };
      $("#b-back2").onclick = ()=>{ $("#ov").classList.remove("show"); openCampaign(cur.cid); };
    }
  } else {
    btns.innerHTML = `<button class="btn" id="b-retry">再演本关</button><button class="btn" id="b-back3">选关</button>`;
    $("#b-retry").onclick = ()=>{ $("#ov").classList.remove("show"); startLevel(cur.cid, cur.li); };
    $("#b-back3").onclick = ()=>{ $("#ov").classList.remove("show"); openCampaign(cur.cid); };
  }
  setTimeout(()=>$("#ov").classList.add("show"), 500);
}
function showFinal(cid){
  const c = CAM[cid], f = FINALE[cid];
  $("#ov-t").textContent = c.name.split(" · ")[1] + " · 终局";
  $("#ov-t").className = "";
  $("#ov-x").innerHTML = `<div class="poem">${f.poem}</div><br>${f.text}`;
  $("#ov-b").innerHTML = `<button class="btn" id="b-home">回到开头</button>`;
  $("#b-home").onclick = ()=>{ $("#ov").classList.remove("show"); renderSelect(); };
}

/* ================= 控制 ================= */
$("#box").onclick = advance;
document.addEventListener("keydown", e=>{
  if(e.code==="Space" || e.code==="Enter"){
    if($("#sc-play").classList.contains("on")){ e.preventDefault(); advance(); }
  }
});
$("#p-retry").onclick = ()=>startLevel(cur.cid, cur.li);
$("#p-back").onclick = ()=>openCampaign(cur.cid);

renderSelect();
</script>
</body>
</html>
